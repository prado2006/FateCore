onboarding:
  spawn: {world: hub, x: 0, y: 65, z: 0}            # TODO: заменить на реальные из F3
  welcome:
    - "&6Добро пожаловать на Эхо Судьбы, &f%player%&6!"
    - "&7Режимы: &fSurvival&7, &fBedWars&7, &fSkyWars&7. Все команды: &e/help"
    - "&7Эхо — очки за игру: &e/echo&7, тратить в &e/shop"
  book:
    title: "Гид новичка"
    author: "FateCore"
    pages:
      - "&6&lКто ты?\n&8&m-------------&r\n&0Выбери класс:\n&6• &0Кузнец\n&6• &0Воин\n&6• &0Странник\n\n&8Смена класса — раз в &67 дней&8."
      - "&6&lКуда идти?\n&8&m-------------&r\n&6Survival &0— строй и ферми.\n&6BedWars &0— PvP за кровати.\n&6SkyWars &0— риск и лут.\n\n&8Порталы в хабе ведут в режимы."
      - "&6&lКак играть?\n&8&m-------------&r\n&0/kit &8— набор привилегии\n&0/sethome &8— сохранить дом\n&0/quests &8— задания дня\n&0/help &8— все команды"
      - "&6&lПравила\n&8&m-------------&r\n&c✖ &0Без читов\n&c✖ &0Без гриферства\n&c✖ &0Без спама и флуда\n&a✔ &0Уважай игроков\n\n&8Нарушение — бан."
      - "&6&lЭхо\n&8&m-------------&r\n&0Эхо — очки за игру.\n\n&6Копишь &8→ &6тратишь в &0/shop\n&8на косметику, кейсы и бусты.\n\n&8Эхо не даёт силы в бою."
      - "&6&lКвесты и донат\n&8&m-------------&r\n&0Квестовый Мастер в хабе даёт &63 задания &0в день: &6/quests\n\n&0Донат &6ускоряет Эхо&0, но не даёт силы: &6/donate"
  signs:
    survival:
      enabled: false
      location: {world: hub, x: 0, y: 65, z: 0}
      lines: ["Survival", "Строй и ферми"]
    bedwars:
      enabled: false
      location: {world: hub, x: 0, y: 65, z: 0}
      lines: ["BedWars", "PvP за кровати"]
    skywars:
      enabled: false
      location: {world: hub, x: 0, y: 65, z: 0}
      lines: ["SkyWars", "Риск и лут"]
    guide:
      enabled: false
      location: {world: hub, x: 0, y: 65, z: 0}
      lines: ["НАЧНИ ЗДЕСЬ", "/help  /echo", "/quests", "/donate"]

quest:
  npc:
    location: {world: hub, x: 5, y: 65, z: 5}       # TODO: заменить на реальные из F3

portals:
  cooldown-seconds: 3
  survival:
    enabled: false
    trigger: {world: hub, x: 0, y: 65, z: 0, radius: 1.5}
    target-world: world_survival
  bedwars:
    enabled: false
    trigger: {world: hub, x: 0, y: 65, z: 0, radius: 1.5}
    target-world: world_bedwars
  skywars:
    enabled: false
    trigger: {world: hub, x: 0, y: 65, z: 0, radius: 1.5}
    target-world: world_skywars

tips-interval-seconds: 600

classes:
  change-days: 7

perks:
  combat-seconds: 10

sethome-tiers:
  default: 30
  vip: 30
  premium: 20
  legend: 20
  elite: 10
  mythic: 10
  titan: 0
  admin: 0
  owner: 0

back-cooldown-seconds: 3600
back-no-cooldown: [mythic, titan, admin, owner]

speed-tiers:
