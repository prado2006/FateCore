learn:
  help:
    header: "&6=== Команды сервера ==="
    lines:
      - "&e/help &7— все команды"
      - "&e/echo &7— твой баланс Эхо"
      - "&e/kit &7— набор привилегии"
      - "&e/sethome &7— сохранить дом"
      - "&e/quests &7— задания Квестового Мастера"
      - "&e/shop &7— магазин за Эхо"
      - "&e/donate &7— привилегии"
      - "&e/rules &7— правила"
  shop:
    title: "&8Магазин Эхо"
    categories:
      cosmetic: {slot: 10, title: "Косметика", icon: NETHER_STAR}
      cases: {slot: 12, title: "Кейсы", icon: CHEST}
      boosts: {slot: 14, title: "Бусты", icon: CLOCK}
    items:
      - {id: prefix, category: cosmetic, name: "Префикс", icon: OAK_SIGN, price: 300, slot: 11}
      - {id: pet, category: cosmetic, name: "Питомец", icon: BONE, price: 1000, slot: 12}
      - {id: particles, category: cosmetic, name: "Частицы", icon: BLAZE_POWDER, price: 500, slot: 13}
      - {id: hat, category: cosmetic, name: "Шляпа", icon: LEATHER_HELMET, price: 200, slot: 14}
      - {id: rename, category: cosmetic, name: "/rename (бирка)", icon: NAME_TAG, price: 150, slot: 15}
      - {id: case_common, category: cases, name: "Обычный кейс", icon: CHEST, price: 200, slot: 12}
      - {id: case_rare, category: cases, name: "Редкий кейс", icon: ENDER_CHEST, price: 500, slot: 14}
      - {id: boost_x2, category: boosts, name: "Буст x2 Эхо на 1 час", icon: GLOWSTONE_DUST, price: 800, slot: 12}
      - {id: home_plus1, category: boosts, name: "+1 дом на 7 дней", icon: OAK_DOOR, price: 400, slot: 14, enabled: false}
  donate:
    button: "[Открыть магазин привилегий]"
    line: "&7Привилегии ускоряют Эхо, но не дают силы"
  rules:
    - "&61. &fБез читов и запрещённых модов."
    - "&62. &fБез гриферства: чужие постройки не трогаем."
    - "&63. &fБез спама и флуда в чате."
    - "&64. &fУважай других игроков и администрацию."
    - "&65. &fДонат не даёт силы — только ускоряет Эхо."
  tips:
    - "&6Совет: &7Эхо тратится на косметику и кейсы — &e/shop"
    - "&6Совет: &7Квестовый Мастер в хабе даёт 3 задания в день — &e/quests"
    - "&6Совет: &7Донат ускоряет Эхо, но не даёт силы — &e/donate"
    - "&6Совет: &e/help &7— все команды"
    - "&6Совет: &7BedWars победа = &e100 Эхо&7, SkyWars убийство = &e+Эхо"

shop:
  rewards:
    prefix:
      - "lp user %player% permission set fatecore.cosmetic.prefix true"
    pet:
      - "lp user %player% permission set fatecore.cosmetic.pet true"
    particles:
      - "lp user %player% permission set fatecore.cosmetic.particles true"
    hat:
      - "lp user %player% permission set essentials.hat true"
    rename:
      - "give %player% minecraft:name_tag 1"
    case_common:
      - "fatecore case %player% common"
    case_rare:
      - "fatecore case %player% rare"
    boost_x2:
      - "fatecore boost %player% 2.0 3600"
    home_plus1: []
