# Определения квестов и «плюшки» + прогресс игроков (progress). Сброс прогресса в 00:00 МСК.
# Разрешённые типы наград: echo, item, effect, key, tools, quest_prefix, echo_boost.
# Привилегии (донат-группы) наградой быть не могут: другие типы игнорируются.
quests:
  survival:
    title: "Собери 32 дерева"
    target: 32
    reward-text: "50 Эхо + XP-бутылка"
    rewards:
      - {type: echo, amount: 50}
      - {type: item, material: EXPERIENCE_BOTTLE, amount: 1}
  bedwars:
    title: "Победи 1 раз"
    target: 1
    reward-text: "100 Эхо + Speed II на 5 мин"
    rewards:
      - {type: echo, amount: 100}
      - {type: effect, effect: SPEED, amplifier: 1, seconds: 300}
  skywars:
    title: "Убей 3 игрока"
    target: 3
    reward-text: "100 Эхо + 8 алмазов"
    rewards:
      - {type: echo, amount: 100}
      - {type: item, material: DIAMOND, amount: 8}

# За выполнение всех 3 квестов — один случайный вариант
plushka:
  - label: "500 Эхо"
    rewards:
      - {type: echo, amount: 500}
  - label: "1 ключ"
    rewards:
      - {type: key, amount: 1}
  - label: "префикс [Quest] на 24 часа"
    rewards:
      - {type: quest_prefix, hours: 24}
  - label: "зачарованные инструменты"
    rewards:
      - type: tools
        items: [DIAMOND_PICKAXE, DIAMOND_AXE, DIAMOND_SHOVEL]
        enchants: {efficiency: 3, unbreaking: 2}
  - label: "+10% Эхо на 1 час"
    rewards:
      - {type: echo_boost, multiplier: 1.10, seconds: 3600}

# Прогресс заполняет плагин. Пример записи:
# progress:
#   069a79f4-44e9-4726-a5be-fca90e38aaf5:
#     survival: 12
#     bedwars: 0
#     skywars: 2
#     dayCompleted: 1
#     lastReset: 2026-10-31
progress: {}
