name: Build FateCore

# Запуск при пуше в main (и вручную из вкладки Actions)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий (в корне лежит FateCore-v26.zip)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Распаковка ZIP и поиск pom.xml — ДО setup-java, чтобы кэшу было что хешировать
      - name: Unzip FateCore-v26.zip and locate pom.xml
        id: locate
        run: |
          set -e
          if [ ! -f FateCore-v26.zip ]; then
            echo "::error::FateCore-v26.zip не найден в корне репозитория"
            ls -la
            exit 1
          fi
          mkdir -p project
          unzip -q -o FateCore-v26.zip -d project

          # Берём самый «мелкий» pom.xml (корень архива или вложенная папка вроде project/FateCore/), без __MACOSX
          POM=$(find project -name pom.xml -not -path "*/__MACOSX/*" | awk '{print length($0) " " $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$POM" ]; then
            echo "::error::pom.xml не найден внутри архива"
            find project -maxdepth 3
            exit 1
          fi
          echo "Найден pom.xml: $POM"
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      # 3. JDK 17 (нужен для Paper 1.20.1). Кэш Maven включён только теперь, когда pom.xml уже распакован
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: project/**/pom.xml

      # 4. Сборка (запасной вариант — профиль authme-5, как раньше)
      - name: Build with Maven
        working-directory: ${{ steps.locate.outputs.dir }}
        run: mvn clean package -B || mvn clean package -B -Pauthme-5

      # Находим итоговый jar (без original-*, sources, javadoc)
      - name: Find built jar
        id: jar
        run: |
          set -e
          JAR=$(find "${{ steps.locate.outputs.dir }}/target" -maxdepth 1 -name "*.jar" \
                  ! -name "original-*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "::error::Собранный jar не найден в target"
            ls -la "${{ steps.locate.outputs.dir }}/target" || true
            exit 1
          fi
          echo "Собран: $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      # 5. Сохраняем jar как артефакт (скачивается на странице запуска во вкладке Actions)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FateCore
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30
