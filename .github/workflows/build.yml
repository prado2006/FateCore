name: Build FateCore

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack FateCore-OPTIMIZED.zip
        run: |
          if [ ! -f FateCore-OPTIMIZED.zip ]; then
            echo "::error::FateCore-OPTIMIZED.zip not found in repository root"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/fatecore-src"
          mkdir -p "$RUNNER_TEMP/fatecore-src"
          unzip -q -o FateCore-OPTIMIZED.zip -d "$RUNNER_TEMP/fatecore-src"

      - name: Locate pom.xml
        run: |
          POM=$(find "$RUNNER_TEMP/fatecore-src" -name pom.xml -not -path '*/__MACOSX/*' -printf '%d %p\n' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$POM" ]; then
            echo "::error::pom.xml not found inside FateCore-OPTIMIZED.zip"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$POM")
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Maven
        working-directory: ${{ env.PROJECT_DIR }}
        run: mvn clean package -B || mvn clean package -B -Pauthme-5

      - name: Prepare FateCore.jar
        run: |
          JAR=$(find "$PROJECT_DIR/target" -maxdepth 1 -name '*.jar' \
                  ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
                  -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          if [ -z "$JAR" ]; then
            echo "::error::No jar found in $PROJECT_DIR/target"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/artifact"
          cp "$JAR" "$RUNNER_TEMP/artifact/FateCore.jar"
          ls -l "$RUNNER_TEMP/artifact"

      - name: Upload FateCore.jar
        uses: actions/upload-artifact@v4
        with:
          name: FateCore
          path: ${{ runner.temp }}/artifact/FateCore.jar
          if-no-files-found: error
