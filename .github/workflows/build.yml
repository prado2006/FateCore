name: Build FateCore
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract project
        run: |
          unzip -o FateCore-FINAL.zip
          if [ ! -f pom.xml ]; then
            POM_DIR=$(find . -mindepth 1 -maxdepth 2 -name pom.xml -exec dirname {} \; | head -n 1)
            if [ -n "$POM_DIR" ]; then
              mv "$POM_DIR"/* .
              rmdir "$POM_DIR"
            fi
          fi
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Build with Maven
        run: mvn clean package -B || mvn clean package -B -Pauthme-5
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FateCore-jar
          path: target/FateCore.jar
