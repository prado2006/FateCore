name: Build FateCore JAR

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Выполняем checkout репозитория в рабочую директорию
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Распаковываем FateCore-v31.zip и поднимаем файлы из вложенной папки в корень (если она есть)
      - name: Unpack FateCore-v31.zip and flatten if nested
        run: |
          set -e
          unzip -q FateCore-v31.zip -d _extracted_tmp

          # Удаляем сам архив, чтобы не мешал при перемещении/сборке
          rm -f FateCore-v31.zip

          # Ищем директорию, содержащую pom.xml (в корне архива или на 1 уровень глубже)
          POM_PATH=$(find _extracted_tmp -maxdepth 2 -name "pom.xml" -print -quit)
          if [ -z "$POM_PATH" ]; then
            echo "Ошибка: pom.xml не найден внутри FateCore-v31.zip"
            exit 1
          fi

          SRC_DIR=$(dirname "$POM_PATH")

          # Переносим всё содержимое найденной папки проекта в корень репозитория
          shopt -s dotglob nullglob
          mv "$SRC_DIR"/* .
          shopt -u dotglob nullglob

          # Чистим временную папку
          rm -rf _extracted_tmp

          # Проверяем, что pom.xml на месте
          ls -la pom.xml

      # 3. Настраиваем Java 17 строго ПОСЛЕ распаковки архива с pom.xml
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 4. Запускаем сборку Maven
      - name: Build with Maven
        run: mvn clean package

      # 5. Сохраняем готовый .jar файл (исключая original-*.jar, если создается shade/fat jar)
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: FateCore-jar
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error
